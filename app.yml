# yaml-language-server: $schema=https://app.pennsieve.io/static/schemas/app-manifest.v1.json
schemaVersion: '1.0'
name: EMBER DeepLabCut Training
description: GPU-based DeepLabCut PyTorch training processor for EMBER pose-estimation datasets using predefined training and validation splits.
applicationType: processor
categories:
  - Machine Learning
tags:
  - DeepLabCut
  - EMBER
  - pose-estimation
  - PyTorch
  - GPU
runtime:
  computeTypes:
    - standard
  gpu:
    enabled: true
    count: 1
resources:
  cpu: 4096
  memory: 16384
parameters:
  - name: NET_TYPE
    type: string
    default: hrnet_w32
  - name: EPOCHS
    type: number
    default: 200
    min: 1
  - name: BATCH_SIZE
    type: number
    default: 2
    min: 1
  - name: SAVE_EPOCHS
    type: number
    default: 10
    min: 1
  - name: MAX_SNAPSHOTS
    type: number
    default: 5
  - name: DISPLAY_ITERS
    type: number
    default: 100
  - name: SHUFFLE
    type: number
    default: 1
  - name: DEVICE
    type: string
    default: cuda:0
  - name: SEED
    type: number
    default: 42
  - name: LEARNING_RATE
    type: string
  - name: WEIGHT_DECAY
    type: string
inputs:
  - name: dlc_project
    dataType: any
    required: true
    description: DLC-formatted project containing config.yaml and the predefined EMBER training and validation labeled-data folders
outputs:
  - name: trained_dlc_project
    dataType: any
    description: Trained DeepLabCut project containing model checkpoints, training configuration, and run metadata.
