schemaVersion: 1.0.0

application:
  id: ember-dlc-training
  name: EMBER DeepLabCut Training
  description: >
    GPU-based DeepLabCut PyTorch training processor using
    predefined EMBER training and validation splits.
  version: 0.1.0
  type: processor

  maintainers:
    - name: Keyvan Ansarino

  tags:
    - DeepLabCut
    - EMBER
    - pose-estimation
    - PyTorch
    - GPU

runtime:
  cpu: 4096
  memory: 16384

  computeTypes:
    - gpu

parameters:

  # ==========================================================
  # MODEL
  # ==========================================================

  - name: NET_TYPE
    type: string
    description: DeepLabCut PyTorch architecture.
    defaultValue: "hrnet_w32"

  # ==========================================================
  # TRAINING
  # ==========================================================

  - name: EPOCHS
    type: number
    description: Number of training epochs.
    defaultValue: "200"

  - name: BATCH_SIZE
    type: number
    description: Number of images per training batch.
    defaultValue: "2"

  - name: SAVE_EPOCHS
    type: number
    description: Save a model checkpoint every N epochs.
    defaultValue: "10"

  - name: MAX_SNAPSHOTS
    type: number
    description: Maximum number of checkpoints retained.
    defaultValue: "5"

  - name: DISPLAY_ITERS
    type: number
    description: Number of iterations between loss log messages.
    defaultValue: "100"

  # ==========================================================
  # DLC MODEL INSTANCE
  # ==========================================================

  - name: SHUFFLE
    type: number
    description: >
      DeepLabCut shuffle/model identifier. This does not
      resplit the predefined EMBER data.
    defaultValue: "1"

  # ==========================================================
  # HARDWARE / REPRODUCIBILITY
  # ==========================================================

  - name: DEVICE
    type: string
    description: PyTorch training device.
    defaultValue: "cuda:0"
    validValues:
      - "cuda:0"

  - name: SEED
    type: number
    description: Random seed for reproducibility.
    defaultValue: "42"

  # ==========================================================
  # OPTIONAL OPTIMIZER OVERRIDES
  # Blank means use DeepLabCut defaults.
  # ==========================================================

  - name: LEARNING_RATE
    type: string
    description: >
      Optional learning-rate override.
      Leave blank to use the DeepLabCut default.
    defaultValue: ""

  - name: WEIGHT_DECAY
    type: string
    description: >
      Optional weight-decay override.
      Leave blank to use the DeepLabCut default.
    defaultValue: ""

inputs:

  - name: dlc_project
    description: >
      DLC-formatted project containing the predefined
      EMBER training and validation labeled-data folders.
      Test data must not be included.
    mediaTypes:
      - application/octet-stream
    cardinality: many
    required: true

outputs:

  - name: trained_dlc_project
    description: >
      Trained DeepLabCut project containing configuration,
      training metadata, and model checkpoints.
    mediaTypes:
      - application/octet-stream
