# yaml-language-server: $schema=https://app.pennsieve.io/static/schemas/app-manifest.v1.json
schemaVersion: '1.0'
name: EMBER DeepLabCut Training
description: GPU-based DeepLabCut PyTorch training processor for EMBER pose-estimation datasets using predefined training and validation splits.
applicationType: processor
categories:
  - Machine Learning
tags:
  - DeepLabCut
  - EMBER
  - pose-estimation
  - PyTorch
  - GPU
runtime:
  computeTypes:
    - standard
  gpu:
    enabled: true
    count: 1
resources:
  cpu: 4096
  memory: 16384
parameters:
  - name: NET_TYPE
    type: string
    defaultValue: "hrnet_w32"
  - name: EPOCHS
    type: number
    defaultValue: "200"
  - name: BATCH_SIZE
    type: number
    defaultValue: "2"
  - name: SAVE_EPOCHS
    type: number
    defaultValue: "10"
  - name: MAX_SNAPSHOTS
    type: number
    defaultValue: "5"
  - name: DISPLAY_ITERS
    type: number
    defaultValue: "100"
  - name: SHUFFLE
    type: number
    defaultValue: "1"
  - name: DEVICE
    type: string
    defaultValue: "cuda:0"
  - name: SEED
    type: number
    defaultValue: "42"
  - name: PROJECT_SUBDIR
    type: string
    defaultValue: "."
inputs:
  - name: dlc_project
    dataType: any
    required: true
    description: DLC-formatted project containing config.yaml and the predefined EMBER training and validation labeled-data folders
outputs:
  - name: trained_dlc_project
    dataType: any
    description: Trained DeepLabCut project containing model checkpoints, training configuration, and run metadata.
