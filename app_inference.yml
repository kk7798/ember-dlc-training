# yaml-language-server: $schema=https://app.pennsieve.io/static/schemas/app-manifest.v1.json
schemaVersion: '1.0'
name: EMBER DeepLabCut Inference
description: Automatically discover a trained DLC project and user-supplied test images,
  external images or videos under INPUT_DIR.
applicationType: processor
categories:
- Machine Learning
tags:
- DeepLabCut
- EMBER
- pose-estimation
- PyTorch
- inference
runtime:
  computeTypes:
  - standard
resources:
  cpu: 4096
  memory: 16384
parameters:
- name: DEVICE
  type: string
  defaultValue: cpu
- name: SHUFFLE
  type: number
  defaultValue: '1'
- name: TRAININGSET_INDEX
  type: number
  defaultValue: '0'
- name: SNAPSHOT_INDEX
  type: number
  defaultValue: '-1'
- name: DETECTOR_SNAPSHOT_INDEX
  type: number
  defaultValue: '-1'
- name: BATCH_SIZE
  type: number
  defaultValue: '1'
- name: CPU_THREADS
  type: number
  defaultValue: '4'
- name: PCUTOFF
  type: number
  defaultValue: '0.6'
- name: PCK_PIXELS
  type: number
  defaultValue: '10'
- name: PLOT_IMAGES
  type: string
  defaultValue: 'false'
inputs:
- name: inference_bundle
  dataType: any
  required: true
  description: One trained DLC project and media to analyze. Discover files recursively
    under INPUT_DIR; labeled <Task>_test folders are evaluated automatically.
outputs:
- name: inference_results
  dataType: any
  description: Predictions, run metadata and optional held-out EMBER evaluation.
